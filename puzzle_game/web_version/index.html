<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Game - Web Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 5px;
            margin: 20px auto;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
        }
        
        .tile {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            border: 2px solid #2E7D32;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .tile:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .tile.empty {
            background: transparent;
            border: 2px dashed #ccc;
            cursor: default;
        }
        
        .tile.empty:hover {
            transform: none;
            box-shadow: none;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #1976D2;
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        
        .instructions h3 {
            margin-top: 0;
            color: #333;
        }
        
        .instructions ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 5px 0;
        }
        
        .win-message {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
        }
        
        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
                gap: 3px;
            }
            
            .tile {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧩 Puzzle Game</h1>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="time">00:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- Tiles will be generated by JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn" onclick="shuffleGame()">🔀 Shuffle</button>
            <button class="btn" onclick="resetGame()">🔄 Reset</button>
            <button class="btn" onclick="saveGame()">💾 Save</button>
            <button class="btn" onclick="loadGame()">📁 Load</button>
        </div>
        
        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Click on a tile next to the empty space to move it</li>
                <li>Arrange tiles in order from 1 to 15</li>
                <li>The empty space should be in the bottom-right corner when solved</li>
                <li>Use keyboard arrows for faster gameplay</li>
            </ul>
        </div>
        
        <div id="winMessage" class="win-message" style="display: none;">
            🎉 Congratulations! You solved the puzzle!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
